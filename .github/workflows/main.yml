name: Daily Muli Short

# 1 video/day — 9:30 AM IST. Was 2/day; at that rate the 50-topic bank is
# exhausted and reset every 25 days, and every reset starts the repeats again.
# ── AUTO-PAUSE 28 Aug – 31 Aug 2026 ──────────────────────────────────
# Cron chaalu hai, par neeche 'gate' job 1 September se pehle build ko
# chalne nahi deta. Kisi ko yaad rakhne ki zaroorat nahi — 1 tareekh ko
# ye apne aap roz chalne lagega.
#
# Wajah: Actions ke minutes khatam ho rahe the (~1,860 / 2,000 is mahine;
# ye poore ACCOUNT me sab repos ke beech share hote hain). Is workflow ka
# har run ~26 MINUTE leta hai (44 run = 1,137 min) — akele hi aadha quota.
# Usse QUIZ PATHSHALA ke runs 3-4 ghante late chal rahe the. Minutes har
# mahine ki 1 tareekh ko reset hote hain.
#
# Kharcha: gate job ~10 second me exit hota hai (1 min bill), build job
# shuru hi nahi hota. 4 din = ~4 minute.
#
# 1 Sept ke baad gate job delete kar sakte ho — wo tab tak no-op hoga.
# Manual run (workflow_dispatch) par gate lagta hi nahi, wo hamesha chalta hai.
#
# ASLI FIX abhi baaki: 26 min/run bahut zyada hai (quiz pipeline 2 min me
# ho jaati hai). Wo kam karo, warna agle mahine phir yahi dikkat.
# ─────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "0 4 * * *"      # 09:30 AM IST (04:00 UTC)
  workflow_dispatch: {}

# The run marks topics used in topic_bank.json and pushes the file back, so the
# next run knows what has already aired. Without write access that memory is
# lost on every fresh checkout and topics get picked again at random.
permissions:
  contents: write

concurrency:
  group: daily-muli-short
  cancel-in-progress: true

jobs:
  gate:
    # Sirf date check. RESUME_ON aane tak scheduled build skip hota hai.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          RESUME_ON=2026-09-01
          TODAY=$(date -u +%F)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual run — gate lagu nahi"
            echo "run=yes" >> $GITHUB_OUTPUT
          elif [[ "$TODAY" < "$RESUME_ON" ]]; then
            echo "::notice::$TODAY, $RESUME_ON se pehle — Actions minutes bachane ke liye skip"
            echo "run=no" >> $GITHUB_OUTPUT
          else
            echo "$TODAY — resume date aa gaya, normal chalega"
            echo "run=yes" >> $GITHUB_OUTPUT
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write config.json from secret
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          if [ -z "$CONFIG_JSON" ]; then
            echo "CONFIG_JSON secret is empty"
            exit 1
          fi
          printf '%s\n' "$CONFIG_JSON" > config.json
          python -c "import json; json.load(open('config.json')); print('config.json OK')"

      - name: Write token.json if present
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          if [ -n "$TOKEN_JSON" ]; then
            printf '%s\n' "$TOKEN_JSON" > token.json
            echo "token.json written"
          else
            echo "TOKEN_JSON secret not set — YouTube upload may fail"
          fi

      - name: Run short generator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: RABOvaPec1ymXz02oDQi
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ultimate_shorts_agent.py run

      - name: Persist the used-topic list
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topic_bank.json slideshow_topics.json topic_performance.json || true
          if git diff --staged --quiet; then
            echo "no topic-bank change to persist"
            exit 0
          fi
          git commit -m "chore: topic bank + performance ledger [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          echo "could not persist topic bank" >&2
          exit 1
