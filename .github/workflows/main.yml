name: Daily Muli Short

# 2 videos/day — 9:30 AM IST + 5:00 PM IST
on:
  schedule:
    - cron: "0 4 * * *"      # 09:30 AM IST (04:00 UTC)
    - cron: "30 11 * * *"    # 05:00 PM IST (11:30 UTC)
  workflow_dispatch: {}

concurrency:
  group: daily-muli-short
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write config.json from secret
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          if [ -z "$CONFIG_JSON" ]; then
            echo "CONFIG_JSON secret is empty"
            exit 1
          fi
          printf '%s\n' "$CONFIG_JSON" > config.json
          python -c "import json; json.load(open('config.json')); print('config.json OK')"

      - name: Write token.json if present
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          if [ -n "$TOKEN_JSON" ]; then
            printf '%s\n' "$TOKEN_JSON" > token.json
            echo "token.json written"
          else
            echo "TOKEN_JSON secret not set — YouTube upload may fail"
          fi

      - name: Run short generator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: RABOvaPec1ymXz02oDQi
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ultimate_shorts_agent.py run
