name: Daily Muli Short

# ── HARD PAUSED ──────────────────────────────────────────────────────
# User request: stop completely (low views, credits burning).
# Schedule is removed. Even workflow_dispatch is blocked unless the
# caller explicitly passes force_run=true. External daily triggers at
# ~02:30 UTC will now no-op instead of publishing.
# To resume later: either set force_run when dispatching, or restore
# the schedule + remove the force gate.
# ─────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "ONLY set true to actually build+upload. Default blocks the run."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-muli-short
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          FORCE="${{ github.event.inputs.force_run }}"
          if [ "$FORCE" = "true" ]; then
            echo "force_run=true — allowing build"
            echo "run=yes" >> $GITHUB_OUTPUT
          else
            echo "::notice::Daily Muli Short is HARD PAUSED. force_run was not true — skipping to save credits."
            echo "run=no" >> $GITHUB_OUTPUT
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write config.json from secret
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          if [ -z "$CONFIG_JSON" ]; then
            echo "CONFIG_JSON secret is empty"
            exit 1
          fi
          printf '%s\n' "$CONFIG_JSON" > config.json
          python -c "import json; json.load(open('config.json')); print('config.json OK')"

      - name: Write token.json if present
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          if [ -n "$TOKEN_JSON" ]; then
            printf '%s\n' "$TOKEN_JSON" > token.json
            echo "token.json written"
          else
            echo "TOKEN_JSON secret not set — YouTube upload may fail"
          fi

      - name: Run short generator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: RABOvaPec1ymXz02oDQi
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ultimate_shorts_agent.py run

      - name: Persist the used-topic list
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topic_bank.json slideshow_topics.json topic_performance.json || true
          if git diff --staged --quiet; then
            echo "no topic-bank change to persist"
            exit 0
          fi
          git commit -m "chore: topic bank + performance ledger [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          echo "could not persist topic bank" >&2
          exit 1
